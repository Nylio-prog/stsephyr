sample:
  name: STSAFE-A120 symmetric-key provisioning and operations
  description: Provision or establish a key and exercise CMAC or CCM

common:
  tags: [security, i2c, stsafe, destructive, provisioned]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  build_only: true
  extra_configs:
    - CONFIG_SAMPLE_STSAFE_ALLOW_SYMMETRIC_KEY_WRITE=y

tests:
  sample.stsephyr.symmetric_key.establish_cmac:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_SYMMETRIC_ESTABLISH_CMAC=y
  sample.stsephyr.symmetric_key.establish_ccm:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_SYMMETRIC_ESTABLISH_CCM=y
  sample.stsephyr.symmetric_key.wrapped_cmac:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_SYMMETRIC_WRAPPED_CMAC=y
  sample.stsephyr.symmetric_key.wrapped_ccm:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_SYMMETRIC_WRAPPED_CCM=y
