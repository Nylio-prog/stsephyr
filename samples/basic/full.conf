CONFIG_STSEPHYR_ECC_BRAINPOOL_P256=y
CONFIG_STSEPHYR_ECC_BRAINPOOL_P384=y
CONFIG_STSEPHYR_ECC_BRAINPOOL_P512=y
CONFIG_STSEPHYR_ECC_CURVE25519=y
CONFIG_STSEPHYR_HOST_SESSION=y
CONFIG_STSEPHYR_HOST_KEY_ESTABLISHMENT=y
CONFIG_STSEPHYR_HOST_KEY_WRAPPED_PROVISIONING=y
CONFIG_STSEPHYR_SYMMETRIC_KEY_ESTABLISHMENT=y
CONFIG_STSEPHYR_SYMMETRIC_KEY_WRAPPED_PROVISIONING=y
