sample:
  name: STSEphyr customer project template
  description: Minimal safe starting point for an STSAFE-A120 Zephyr application

common:
  tags: [security, i2c, stsafe]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  harness: console
  harness_config:
    type: one_line
    regex: ["PASS: project_template"]
    fixture: stsafe_a120

tests:
  sample.stsephyr.project_template: {}
