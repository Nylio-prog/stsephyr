sample:
  name: STSAFE-A120 local-envelope wrapping
  description: Generate a local wrapping key and verify payload wrap/unwrap

common:
  tags: [security, i2c, stsafe, destructive, provisioned]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  build_only: true
  extra_configs:
    - CONFIG_SAMPLE_STSAFE_ENABLE_KEY_WRAPPING=y
    - CONFIG_SAMPLE_STSAFE_ALLOW_WRAP_KEY_GENERATION=y

tests:
  sample.stsephyr.key_wrapping: {}
