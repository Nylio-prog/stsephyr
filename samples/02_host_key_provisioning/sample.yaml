sample:
  name: STSAFE-A120 host-key provisioning
  description: Provision host-session keys using an explicitly selected method

common:
  tags: [security, i2c, stsafe, destructive]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  build_only: true
  extra_configs:
    - CONFIG_SAMPLE_STSAFE_ALLOW_HOST_KEY_PROVISIONING=y

tests:
  sample.stsephyr.host_key_provisioning.plaintext:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_HOST_KEY_PLAINTEXT=y
  sample.stsephyr.host_key_provisioning.wrapped:
    extra_configs:
      - CONFIG_SAMPLE_STSAFE_HOST_KEY_WRAPPED=y
