sample:
  name: STSAFE-A120 echo loop
  description: Exercise variable-length STSAFE-A120 echo commands

common:
  tags: [security, i2c, stsafe]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  harness: console
  harness_config:
    type: one_line
    regex: ["PASS: 01_echo_loop"]
    fixture: stsafe_a120

tests:
  sample.stsephyr.echo_loop: {}
