CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_STSEPHYR_LOG_LEVEL_INF=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ASSERT=y

# Device authentication is dominated by host-side P-256 signature verification.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
CONFIG_SPEED_OPTIMIZATIONS=y
