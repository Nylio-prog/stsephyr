sample:
  name: STSAFE-A120 device authentication
  description: Verify the device certificate and prove possession of slot 0

common:
  tags: [security, i2c, stsafe]
  platform_allow: [nucleo_l452re]
  integration_platforms: [nucleo_l452re]
  extra_args: [SHIELD=x_nucleo_ese01a1]
  harness: console
  harness_config:
    type: one_line
    regex: ["PASS: 01_device_authentication"]
    fixture: stsafe_a120

tests:
  sample.stsephyr.device_authentication: {}
